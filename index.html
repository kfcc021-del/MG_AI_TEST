<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --panel: rgba(255, 255, 255, 0.88);
      --text: #171821;
      --muted: #737686;
      --line: rgba(20, 22, 35, 0.08);
      --primary: #635bff;
      --primary-2: #8b5cf6;
      --primary-soft: #eeedff;
      --accent: #fff0a8;
      --shadow: 0 24px 60px rgba(51, 46, 114, 0.10);
      --shadow-soft: 0 10px 30px rgba(24, 24, 38, 0.06);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(99, 91, 255, .13), transparent 31%),
        radial-gradient(circle at 88% 10%, rgba(139, 92, 246, .10), transparent 28%),
        linear-gradient(180deg, #faf9ff 0%, #f6f7fb 46%, #f8f9fb 100%);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(99,91,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(99,91,255,.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 58%);
      z-index: -1;
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 54px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(99, 91, 255, .14), rgba(139, 92, 246, .18));
      box-shadow: 0 8px 20px rgba(99, 91, 255, .16);
      border: 1px solid rgba(255,255,255,.72);
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.06);
    }

    .top-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .hero {
      position: relative;
      padding: 18px 0 34px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(99, 91, 255, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }

    h1 {
      max-width: 800px;
      margin: 0 auto;
      font-size: clamp(38px, 6.4vw, 66px);
      line-height: 1.04;
      letter-spacing: -0.055em;
      font-weight: 850;
    }

    .gradient-text {
      background: linear-gradient(105deg, #3b36d6, #7657ff 48%, #a64de5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 720px;
      margin: 18px auto 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
      word-break: keep-all;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .stat-chip {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.74);
      color: #55586a;
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(12px);
    }

    .search-panel,
    .results-panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-panel {
      position: relative;
      padding: 14px;
      margin: 6px auto 26px;
      border-radius: 28px;
    }

    .search-panel::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(130deg, rgba(99,91,255,.38), rgba(255,255,255,.3), rgba(139,92,246,.24));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .search-input-wrap { position: relative; }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #7d7f8f;
      pointer-events: none;
      font-size: 20px;
    }

    input[type="search"] {
      width: 100%;
      height: 60px;
      border: 1px solid transparent;
      border-radius: 18px;
      padding: 0 18px 0 50px;
      font-size: 16px;
      outline: none;
      background: rgba(248,249,252,.92);
      color: var(--text);
      transition: .2s ease;
    }

    input[type="search"]::placeholder { color: #9a9cac; }

    input[type="search"]:focus {
      background: #fff;
      border-color: rgba(99,91,255,.35);
      box-shadow: 0 0 0 5px rgba(99, 91, 255, .08);
    }

    .all-button {
      height: 60px;
      border: 0;
      border-radius: 18px;
      padding: 0 22px;
      background: linear-gradient(135deg, var(--primary), #776dff);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(99,91,255,.22);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .all-button:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(99,91,255,.28); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding: 0 2px 2px;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.74);
      color: #656879;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: all .18s ease;
    }

    .filter-btn:hover { transform: translateY(-1px); color: var(--primary); }
    .filter-btn.active {
      border-color: rgba(99,91,255,.16);
      background: var(--primary-soft);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(99,91,255,.04);
    }

    .results-panel {
      overflow: hidden;
      border-radius: 26px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.52);
    }

    .results-header h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.025em;
    }

    .result-count {
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1f0ff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .faq-list { display: grid; }

    .faq-item {
      position: relative;
      padding: 24px;
      border-bottom: 1px solid var(--line);
      transition: background .18s ease, transform .18s ease;
    }

    .faq-item:hover { background: rgba(99,91,255,.025); }
    .faq-item:last-child { border-bottom: 0; }

    .category-badge,
    .source-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .category-badge {
      margin: 0 5px 11px 0;
      background: #eeedff;
      color: var(--primary);
    }

    .source-badge {
      margin: 0 0 11px;
      background: #f5f6f8;
      color: #7a7d8c;
      border: 1px solid var(--line);
    }

    .question {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.55;
      letter-spacing: -0.025em;
      font-weight: 800;
    }

    .answer {
      margin: 0;
      color: #626574;
      line-height: 1.78;
      font-size: 14px;
      word-break: keep-all;
    }

    mark {
      background: var(--accent);
      color: inherit;
      padding: 1px 3px;
      border-radius: 5px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .empty-state {
      padding: 70px 22px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }

    .empty-state::before {
      content: "⌕";
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 15px;
      border-radius: 15px;
      background: #f0efff;
      color: var(--primary);
      font-size: 23px;
      font-weight: 800;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 17px;
    }


    .hero-mascot-wrap {
      position: absolute;
      right: 2.5%;
      bottom: 6px;
      width: clamp(100px, 12vw, 148px);
      height: clamp(100px, 12vw, 148px);
      display: grid;
      place-items: center;
      border-radius: 34px;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 18px 40px rgba(66, 98, 184, .14);
      backdrop-filter: blur(12px);
      transform: rotate(3deg);
      pointer-events: none;
      z-index: 1;
    }

    .hero-mascot {
      width: 88%;
      height: 88%;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(66, 98, 184, .18));
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .empty-state::before { display: none; }

    .empty-mascot {
      width: 78px;
      height: 78px;
      margin-bottom: 14px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 10px 24px rgba(66, 98, 184, .12);
    }

    @media (max-width: 680px) {
      .app { padding-top: 22px; }
      .topbar { margin-bottom: 34px; }
      .top-note { display: none; }
      .hero { padding-top: 8px; }
      .hero-mascot-wrap {
        right: 50%;
        bottom: -10px;
        transform: translateX(50%) rotate(2deg);
        width: 92px;
        height: 92px;
        opacity: .88;
      }
      .hero-copy { padding-bottom: 72px; }
      h1 { font-size: clamp(36px, 12vw, 50px); }
      .subtitle { font-size: 14px; }
      .search-panel { border-radius: 22px; padding: 10px; }
      .search-row { grid-template-columns: 1fr; }
      .all-button { width: 100%; height: 52px; }
      input[type="search"] { height: 56px; }
      .results-header { align-items: flex-start; }
      .faq-item { padding: 21px 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><img src="" data-mascot alt="" aria-hidden="true"></span><span>Work FAQ</span></div>
      <div class="top-note">필요한 업무 답변을 빠르게 찾아보세요</div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
      <span class="eyebrow">✦ 사내 업무 지식 검색</span>
      <h1 id="page-title">찾고 싶은 업무 답변을<br><span class="gradient-text">한 번에 검색하세요.</span></h1>
      <p class="subtitle">기존 JSON FAQ와 예상 FAQ(합성)를 함께 검색합니다. 예상 FAQ는 실제 사내 규정이 아니므로 공식 기준이 필요한 경우 관련 안내자료를 확인하세요.</p>
      <div class="hero-stats" aria-label="FAQ 안내">
        <span class="stat-chip">총 105개 FAQ</span>
        <span class="stat-chip">4개 업무 분류</span>
        <span class="stat-chip">FAQ 기반 답변만 표시</span>
      </div>

      </div>
      <div class="hero-mascot-wrap" aria-hidden="true"><img class="hero-mascot" src="" data-mascot alt=""></div>
    </section>

    <section class="search-panel" aria-label="FAQ 검색 및 분류">
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="질문이나 키워드를 입력하세요." autocomplete="off" />
        </div>
        <button id="showAllBtn" class="all-button" type="button">전체보기</button>
      </div>

      <div class="filters" aria-label="분류 필터">
        <button class="filter-btn active" type="button" data-category="전체">전체</button>
        <button class="filter-btn" type="button" data-category="교육">교육</button>
        <button class="filter-btn" type="button" data-category="문서">문서</button>
        <button class="filter-btn" type="button" data-category="IT">IT</button>
        <button class="filter-btn" type="button" data-category="보안">보안</button>
      </div>
    </section>

    <section class="results-panel" aria-labelledby="results-title">
      <div class="results-header">
        <h2 id="results-title">검색 결과</h2>
        <div id="resultCount" class="result-count" aria-live="polite"></div>
      </div>
      <div id="faqList" class="faq-list"></div>
    </section>
  </main>

  <script>
    // 기존 JSON 5개 항목 + 일반적인 업무 상황을 바탕으로 만든 예상 FAQ(합성) 100개입니다.

    document.querySelectorAll('[data-mascot]').forEach((img) => { img.src = mascotDataUri; });

    const searchInput = document.getElementById('searchInput');
    const showAllBtn = document.getElementById('showAllBtn');
    const faqList = document.getElementById('faqList');
    const resultCount = document.getElementById('resultCount');
    const filterButtons = [...document.querySelectorAll('.filter-btn')];

    let selectedCategory = '전체';

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmed = keyword.trim();
      if (!trimmed) return safeText;

      const safeKeyword = escapeRegExp(escapeHtml(trimmed));
      return safeText.replace(new RegExp(`(${safeKeyword})`, 'gi'), '<mark>$1</mark>');
    }

    function getFilteredFaqs() {
      const keyword = searchInput.value.trim().toLowerCase();

      return faqData.filter((item) => {
        const categoryMatches = selectedCategory === '전체' || item.category === selectedCategory;
        const text = `${item.question} ${item.answer_seed}`.toLowerCase();
        const keywordMatches = !keyword || text.includes(keyword);
        return categoryMatches && keywordMatches;
      });
    }

    function render() {
      const keyword = searchInput.value.trim();
      const filtered = getFilteredFaqs();

      resultCount.textContent = `총 ${filtered.length}건`;

      if (filtered.length === 0) {
        // 등록된 FAQ에 일치하는 항목이 없을 때는 임의의 답변을 생성하지 않고
        // 아래의 고정 안내문만 표시합니다.
        faqList.innerHTML = `
          <div class="empty-state">
            <img class="empty-mascot" src="${mascotDataUri}" alt="" aria-hidden="true">
            <strong>등록된 FAQ에서 답변을 찾을 수 없습니다.</strong>
            관련 담당부서 또는 공식 안내자료를 확인해 주세요.
          </div>
        `;
        return;
      }

      faqList.innerHTML = filtered.map((item) => `
        <article class="faq-item">
          <span class="category-badge">${escapeHtml(item.category)}</span>
          <span class="source-badge">${escapeHtml(item.source || '기존 JSON')}</span>
          <h3 class="question">${highlight(item.question, keyword)}</h3>
          <p class="answer">${highlight(item.answer_seed, keyword)}</p>
        </article>
      `).join('');
    }

    searchInput.addEventListener('input', render);

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        selectedCategory = button.dataset.category;
        filterButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
        render();
      });
    });

    showAllBtn.addEventListener('click', () => {
      searchInput.value = '';
      selectedCategory = '전체';
      filterButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.category === '전체'));
      searchInput.focus();
      render();
    });

    render();
  </script>
